# 籌碼力度選股會員網站。KV 的 id 由 .github/workflows/site.yml 在部署時自動建立並填入，這裡不用改。
name = "chip-force-site"
main = "worker.js"
compatibility_date = "2026-09-01"

[[kv_namespaces]]
binding = "SITE_KV"
id = "__SITE_KV_ID__"

# 每日選股的準時觸發：週一到週五 UTC 09:30–14:30 每小時（台北 17:30–22:30）。
# Worker 會呼叫 GitHub 執行「籌碼力度每日選股」；當天已完成的會自動略過，所以多排幾次沒關係。
# 注意：Cloudflare 的星期數字 1 是星期日，寫 1-5 會變成日～四、漏掉週五，所以用英文縮寫。
[triggers]
crons = ["30 9-14 * * MON-FRI"]

[vars]
GH_REPO = "yinruei/chip-force"
# 放本月驗證碼的 Skool 課程網址（註冊頁、驗證頁、使用說明會連到這裡）
SKOOL_URL = "https://www.skool.com/fosi-trading-1190/classroom/f2d532b7?md=38579a96eb5a4c3faeaeb2d3c9c4b917"
# 付費方案頁（展示版的「加入雷達席」按鈕）
JOIN_URL = "https://www.skool.com/fosi-trading-1190/plans"
# 展示版 /demo（不用登入、延遲約一個月的資料）。律師建議不要公開時改成 "off"
DEMO = "on"
