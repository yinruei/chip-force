name: 回補價量（K 棒用）

# 手動執行：補上最高最低價，並往前補到約 310 個交易日（240 日均線用）。可以重複執行，已補好的日子會略過。
on:
  workflow_dispatch:

concurrency:
  group: chip-force-daily-run
  cancel-in-progress: false

jobs:
  refill:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 回補
        run: python refill_px.py --budget-min 50
      - name: 寫入結果
        if: always()
        run: |
          git config user.name  "chip-force-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "回補價量（最高最低價）"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push
