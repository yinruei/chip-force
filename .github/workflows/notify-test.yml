name: 測試上榜通知

# 手動執行：對某位會員開啟通知的裝置送一則測試通知（確認推播設定成功）。
on:
  workflow_dispatch:
    inputs:
      email:
        description: "會員的 email"
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 送出測試通知
        env:
          EMAIL: ${{ inputs.email }}
        run: |
          pip install -q pywebpush==2.0.3
          export CLOUDFLARE_ACCOUNT_ID=$(printf %s "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          export CLOUDFLARE_API_TOKEN=$(printf %s "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          export KV_ID=$(bash site/kv_id.sh)
          python notify.py --test "$EMAIL"
