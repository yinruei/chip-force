name: 籌碼力度每日選股

on:
  schedule:
    # 主要觸發改由 Cloudflare Worker 的排程（台北 17:30 起每小時，見 site/wrangler.toml），準時很多；
    # 這裡的 GitHub 排程只當備援：GitHub 常延遲 6–9 小時，已完成的當天會自動略過。
    - cron: "47 9 * * 1-5"
    - cron: "47 10 * * 1-5"
    - cron: "47 11 * * 1-5"
    - cron: "47 12 * * 1-5"
    - cron: "47 13 * * 1-5"
    - cron: "47 14 * * 1-5"
    - cron: "47 15 * * 1-5"
  workflow_dispatch:        # 也可在 Actions 頁面手動按 Run
    inputs:
      date:
        description: "指定日期 YYYY-MM-DD，可用逗號分隔多天（留空＝今天）"
        required: false
        default: ""
      auto:
        description: "自動觸發（Cloudflare 排程用）：已完成的當天會略過"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: chip-force-daily-run
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # 排隊的執行也取最新的分支頂端（含上一次執行 commit 的快取）
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 排程觸發時，若「應該已有資料的最近交易日」已經做過就略過（台北 16:00 前算前一個工作日），
      # 避免延遲到半夜的 cron 重做一次、多出無意義的 commit
      - name: 檢查是否已完成
        id: chk
        run: |
          T=$(python -c "import datetime as d;n=d.datetime.now(d.timezone(d.timedelta(hours=8)));t=n.date()-d.timedelta(days=0 if n.hour>=16 else 1)
          while t.weekday()>4: t-=d.timedelta(days=1)
          print(t.strftime('%Y%m%d'))")
          echo "應有資料的交易日：$T"
          if { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.auto }}" = "true" ]; } && [ -s "data/vol_$T.csv" ] && [ -f "output/${T}_三大法人.md" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"; echo "已完成，略過"
          fi

      - name: 三大法人 × 佔股本比
        if: steps.chk.outputs.done != 'true'
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          IFS=', ' read -ra DS <<< "$INPUT_DATE"
          for d in "${DS[@]}"; do python chip_force.py --investor 三大法人 --date "$d"; done
          python chip_force.py --investor 三大法人
      - name: 投信 × 佔股本比（投本比）
        if: steps.chk.outputs.done != 'true'
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          IFS=', ' read -ra DS <<< "$INPUT_DATE"
          for d in "${DS[@]}"; do python chip_force.py --investor 投信 --mode 穩健 --date "$d"; done
          python chip_force.py --investor 投信 --mode 穩健

      # 頁面的收盤價與漲跌幅用 data/px_*.csv；只補缺的日子，失敗不影響其他步驟
      - name: 補抓近期收盤價
        if: steps.chk.outputs.done != 'true'
        continue-on-error: true
        run: python fill_prices.py

      - name: 產生視覺化頁面
        if: steps.chk.outputs.done != 'true'
        run: python build_dashboard.py

      # 有設定 Cloudflare secrets 才上傳到會員網站；失敗不影響其他步驟
      - name: 上傳到會員網站
        if: steps.chk.outputs.done != 'true' && env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        run: bash site/upload.sh

      # 會員追蹤的股票今天上榜 → 推播通知（notify.py）；失敗不影響其他步驟
      - name: 推播上榜通知
        if: steps.chk.outputs.done != 'true' && env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        run: |
          pip install -q pywebpush==2.0.3
          export KV_ID=$(bash site/kv_id.sh)
          python notify.py

      # 把頁面上半部截成 PNG（output/screenshots/latest_投信.png 等），方便貼到 Skool；失敗不影響其他步驟
      - name: 產生 Skool 用截圖
        if: steps.chk.outputs.done != 'true'
        continue-on-error: true
        run: |
          pip install -q playwright==1.48.0
          python -m playwright install --with-deps chromium > /dev/null
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji > /dev/null
          python screenshot.py
          # 產業觀察圖（output/social/latest_產業觀察.png），給 Threads／IG 用；只講產業、不出現個股
          python social_card.py || echo "產業觀察圖產生失敗（不影響其他結果）"

      - name: 顯示在 Actions 摘要
        if: always() && steps.chk.outputs.done != 'true'
        run: cat output/latest_三大法人.md output/latest_投信.md >> "$GITHUB_STEP_SUMMARY" || true

      # always()：就算回補到一半逾時／失敗，已抓好的快取也先存起來，下次接著跑
      - name: 寫入結果
        if: always() && steps.chk.outputs.done != 'true'
        run: |
          git config user.name  "chip-force-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data output
          git diff --cached --quiet || git commit -m "籌碼力度 $(TZ=Asia/Taipei date +%F)"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push
