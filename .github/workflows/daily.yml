name: 籌碼力度每日選股

on:
  schedule:
    # 週一到週五，台北時間 17:47／19:17／21:07（UTC 09:47／11:17／13:07）。
    # 證交所法人資料約 16:30 前公布；GitHub 的排程常延遲數小時，所以排三次，已完成的當天會自動略過。
    - cron: "47 9 * * 1-5"
    - cron: "17 11 * * 1-5"
    - cron: "7 13 * * 1-5"
  push:
    # 推送 trigger/run 就會立刻跑一次（Claude 的每日更新排程用這個，不必等 GitHub 延遲的 cron）
    paths:
      - "trigger/run"
  workflow_dispatch:        # 也可在 Actions 頁面手動按 Run
    inputs:
      date:
        description: "指定日期 YYYY-MM-DD，可用逗號分隔多天（留空＝今天）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: chip-force-daily-run
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # 排隊的執行也取最新的分支頂端（含上一次執行 commit 的快取）
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 排程觸發、且今天（台北日期）已經有結果就略過，避免一天三次都重做又多出無意義的 commit
      - name: 檢查今天是否已完成
        id: chk
        run: |
          T=$(TZ=Asia/Taipei date +%Y%m%d)
          if [ "${{ github.event_name }}" = "schedule" ] && [ -s "data/vol_$T.csv" ] && [ -f "output/${T}_三大法人.md" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"; echo "今天（$T）已完成，略過"
          fi

      # 第一次會回抓約 60+ 個交易日（證交所限流，約 10–20 分鐘），之後每天只抓 1 天
      # 指定了日期就逐日各跑一次，最後再跑一次「今天」，讓 latest_*.md 維持最新一天
      - name: 三大法人 × 佔股本比
        if: steps.chk.outputs.done != 'true'
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          IFS=', ' read -ra DS <<< "$INPUT_DATE"
          for d in "${DS[@]}"; do python chip_force.py --investor 三大法人 --date "$d"; done
          python chip_force.py --investor 三大法人
      - name: 投信 × 佔股本比（投本比）
        if: steps.chk.outputs.done != 'true'
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          IFS=', ' read -ra DS <<< "$INPUT_DATE"
          for d in "${DS[@]}"; do python chip_force.py --investor 投信 --mode 穩健 --date "$d"; done
          python chip_force.py --investor 投信 --mode 穩健

      - name: 產生視覺化頁面
        if: steps.chk.outputs.done != 'true'
        run: python build_dashboard.py

      - name: 顯示在 Actions 摘要
        if: always() && steps.chk.outputs.done != 'true'
        run: cat output/latest_三大法人.md output/latest_投信.md >> "$GITHUB_STEP_SUMMARY" || true

      # always()：就算回補到一半逾時／失敗，已抓好的快取也先存起來，下次接著跑
      - name: 寫入結果
        if: always() && steps.chk.outputs.done != 'true'
        run: |
          git config user.name  "chip-force-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data output
          git diff --cached --quiet || git commit -m "籌碼力度 $(TZ=Asia/Taipei date +%F)"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push
